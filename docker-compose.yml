services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: clinic
      POSTGRES_PASSWORD: clinic_dev_password
      POSTGRES_DB: clinic_dev
    ports:
      - "5432:5432"
    volumes:
      - clinic_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U clinic -d clinic_dev"]
      interval: 5s
      timeout: 5s
      retries: 10

  server:
    build: ./server
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: "postgresql://clinic:clinic_dev_password@postgres:5432/clinic_dev"
      JWT_ACCESS_SECRET: "dev-only-change-me"
      JWT_ACCESS_EXPIRES_IN: "15m"
      JWT_REFRESH_EXPIRES_IN_DAYS: "7"
      PAYMENT_WEBHOOK_SECRET: "dev-only-change-me"
      PORT: 4000
      NODE_ENV: development
      CLIENT_ORIGIN: "http://localhost:5173"
    ports:
      - "4000:4000"

volumes:
  clinic_pgdata:
